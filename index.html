<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jooser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--bg4:#22222e;
  --accent:#c084fc;--accent2:#a855f7;--accent3:#7c3aed;
  --text:#f0eeff;--text2:#a09ab8;--text3:#6b6580;
  --border:rgba(192,132,252,0.15);--border2:rgba(192,132,252,0.3);
  --success:#4ade80;--danger:#f87171;--warn:#fbbf24;
  --radius:12px;--radius-sm:8px;
  --header-h:56px;--player-h:72px;--bottom-nav-h:60px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
h1,h2,h3,h4{font-family:'Syne',sans-serif}
.hidden{display:none!important}
 
/* TOAST */
.toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);padding:.6rem 1.25rem;border-radius:10px;font-size:.82rem;z-index:9999;text-align:center;max-width:90vw;pointer-events:none;white-space:nowrap}
.toast-ok{background:rgba(74,222,128,.15);color:var(--success);border:1px solid rgba(74,222,128,.3)}
.toast-warn{background:rgba(251,191,36,.1);color:var(--warn);border:1px solid rgba(251,191,36,.25)}
.toast-err{background:rgba(248,113,113,.1);color:var(--danger);border:1px solid rgba(248,113,113,.2)}
 
.screen{display:none;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.screen.active{display:flex}
 
/* ── AUTH ── */
#screen-auth{align-items:center;justify-content:center;padding:1.5rem;position:relative;overflow:hidden auto}
#screen-auth::before{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(124,58,237,0.18) 0%,transparent 70%);top:-150px;left:50%;transform:translateX(-50%);pointer-events:none}
.auth-logo{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;color:var(--accent);letter-spacing:-1px;margin-bottom:.2rem;text-align:center}
.auth-tagline{color:var(--text3);font-size:.78rem;margin-bottom:1.5rem;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:1.5rem;width:100%;max-width:400px;position:relative;z-index:1}
.auth-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:var(--radius-sm);padding:4px;margin-bottom:1.25rem}
.auth-tab{flex:1;padding:.55rem;text-align:center;border-radius:6px;cursor:pointer;font-size:.88rem;font-weight:500;color:var(--text2);transition:all .2s;border:none;background:none;min-height:44px}
.auth-tab.active{background:var(--accent3);color:white}
.auth-panel{display:none}.auth-panel.active{display:block}
label{display:block;font-size:.75rem;color:var(--text3);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=password]{width:100%;padding:.75rem .9rem;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;transition:border-color .2s;margin-bottom:.85rem;-webkit-appearance:none;appearance:none}
input[type=text]:focus,input[type=password]:focus{border-color:var(--accent2)}
textarea{width:100%;padding:.75rem .9rem;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;resize:vertical;min-height:70px}
textarea:focus{border-color:var(--accent2)}
select{width:100%;padding:.75rem .9rem;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none}
select:focus{border-color:var(--accent2)}
.btn{padding:.75rem 1rem;border-radius:var(--radius-sm);font-family:'Syne',sans-serif;font-weight:700;font-size:.88rem;cursor:pointer;border:none;transition:all .18s;letter-spacing:.03em;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;-webkit-tap-highlight-color:transparent}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.btn-full{width:100%}
.btn-primary{background:var(--accent3);color:white}
.btn-primary:hover,.btn-primary:active{background:var(--accent2)}
.btn-secondary{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-secondary:hover,.btn-secondary:active{border-color:var(--border2);color:var(--text)}
.btn-danger{background:rgba(127,29,29,.6);color:#fca5a5;border:1px solid rgba(248,113,113,.2)}
.btn-danger:active{background:rgba(153,27,27,.8)}
.btn-warn{background:rgba(120,80,0,.6);color:#fde68a;border:1px solid rgba(251,191,36,.25)}
.btn-ghost{background:none;border:none;color:var(--text2);cursor:pointer;padding:.35rem .6rem;border-radius:6px;font-size:.82rem;font-family:'DM Sans',sans-serif;min-height:36px;-webkit-tap-highlight-color:transparent}
.btn-ghost:active{color:var(--text);background:var(--bg3)}
.btn-sm{padding:.4rem .75rem;font-size:.8rem;min-height:36px}
.btn-xs{padding:.3rem .6rem;font-size:.75rem;font-family:'DM Sans',sans-serif;border-radius:5px;min-height:32px}
.msg{font-size:.82rem;padding:.5rem .75rem;border-radius:var(--radius-sm);margin-bottom:.75rem;text-align:center}
.msg-err{background:rgba(248,113,113,.1);color:var(--danger);border:1px solid rgba(248,113,113,.2)}
.msg-ok{background:rgba(74,222,128,.1);color:var(--success);border:1px solid rgba(74,222,128,.2)}
.msg-warn{background:rgba(251,191,36,.08);color:var(--warn);border:1px solid rgba(251,191,36,.2)}
.divider{text-align:center;color:var(--text3);font-size:.75rem;margin:.85rem 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border)}
.divider::before{left:0}.divider::after{right:0}
.alert-info{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);color:#7dd3fc;padding:.55rem .9rem;border-radius:var(--radius-sm);margin-bottom:.85rem;font-size:.82rem}
 
/* ── APP LAYOUT ── */
#screen-app{height:100vh;height:100dvh}
.app-header{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 1rem;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;gap:.75rem}
.header-logo{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;color:var(--accent);white-space:nowrap}
.header-search{flex:1;position:relative}
.header-search input{margin-bottom:0;padding-left:2rem;font-size:.88rem}
.search-icon{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.88rem;pointer-events:none}
.header-user{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.user-badge{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:.25rem .65rem;font-size:.72rem;color:var(--accent);white-space:nowrap}
.app-body{display:flex;flex:1;min-height:0;overflow:hidden}
 
/* ── SIDEBAR (desktop only) ── */
.sidebar{width:210px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-scroll{flex:1;overflow-y:auto;padding:.75rem .75rem 1rem}
.sidebar-scroll::-webkit-scrollbar{width:4px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.sidebar-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);padding:.5rem .5rem .2rem}
.nav-item{display:flex;align-items:center;gap:.55rem;padding:.5rem .65rem;border-radius:var(--radius-sm);cursor:pointer;font-size:.83rem;color:var(--text2);transition:all .15s;border:none;background:none;text-align:left;width:100%;min-height:40px;-webkit-tap-highlight-color:transparent}
.nav-item:hover,.nav-item:active{background:var(--bg3);color:var(--text)}
.nav-item.active{background:rgba(124,58,237,.2);color:var(--accent)}
.nav-icon{font-size:.95rem;width:18px;text-align:center;flex-shrink:0}
.pl-nav-row{display:flex;align-items:center;width:100%;gap:.3rem}
.pl-nav-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.pl-del-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:.72rem;padding:.2rem .35rem;border-radius:3px;flex-shrink:0;min-height:28px;min-width:28px}
.pl-del-btn:active{color:var(--danger)}
 
/* ── BOTTOM NAV (mobile only) ── */
.bottom-nav{display:none;height:var(--bottom-nav-h);background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;align-items:stretch;padding:0 .25rem;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;cursor:pointer;border:none;background:none;color:var(--text3);font-size:.6rem;font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;transition:color .15s;padding:.5rem 0;min-height:44px}
.bottom-nav-item.active{color:var(--accent)}
.bottom-nav-icon{font-size:1.35rem;line-height:1}
 
/* ── MAIN CONTENT ── */
.main-content{flex:1;padding:1rem 1rem 1.25rem;overflow-y:auto;background:var(--bg);min-width:0}
.main-content::-webkit-scrollbar{width:4px}
.main-content::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
 
/* ── PLAYER BAR ── */
.player-bar{display:flex;align-items:center;padding:0 1rem;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;gap:.75rem;height:var(--player-h)}
.player-info{display:flex;align-items:center;gap:.6rem;min-width:0;flex:1;overflow:hidden}
.player-cover{width:40px;height:40px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;overflow:hidden}
.player-cover img{width:100%;height:100%;object-fit:cover}
.player-meta{min-width:0;flex:1}
.player-title{font-size:.83rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-artist{font-size:.7rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-center{display:flex;flex-direction:column;align-items:center;gap:.25rem;flex:1;min-width:0}
.player-controls{display:flex;align-items:center;gap:.25rem}
.ctrl-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:.3rem;border-radius:50%;transition:color .15s;font-size:1.05rem;line-height:1;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.ctrl-btn:hover,.ctrl-btn:active{color:var(--accent)}
.ctrl-btn.active-ctrl{color:var(--accent)}
.play-btn{width:38px;height:38px;background:var(--accent3);border-radius:50%;color:white;font-size:.95rem}
.play-btn:hover,.play-btn:active{background:var(--accent2)!important;color:white!important}
.progress-wrap{width:100%;display:flex;flex-direction:column;gap:3px}
.progress-bar{width:100%;height:4px;background:var(--bg4);border-radius:2px;cursor:pointer}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .25s linear}
.progress-times{display:flex;justify-content:space-between;font-size:.6rem;color:var(--text3)}
.player-right{display:flex;align-items:center;gap:.3rem;flex-shrink:0}
 
/* ── CONTENT STYLES ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
.section-title{font-size:1.35rem;font-weight:700}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.75rem}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent}
.card:active{border-color:var(--border2);background:var(--bg3)}
.card-art{width:100%;aspect-ratio:1;background:var(--bg3);border-radius:var(--radius-sm);margin-bottom:.6rem;display:flex;align-items:center;justify-content:center;font-size:2rem;position:relative;overflow:hidden}
.card-art img{width:100%;height:100%;object-fit:cover}
.play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;font-size:1.6rem}
.card:hover .play-overlay{display:flex}
.card-name{font-size:.83rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:.7rem;color:var(--text3);margin-top:.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 
/* Song rows */
.song-row{display:flex;align-items:center;gap:.6rem;padding:.65rem .5rem;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent}
.song-row:active,.song-row.playing{background:rgba(124,58,237,.15)}
.song-num{width:20px;text-align:center;font-size:.76rem;color:var(--text3);flex-shrink:0}
.song-thumb{width:42px;height:42px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;overflow:hidden}
.song-thumb img{width:100%;height:100%;object-fit:cover}
.song-info{flex:1;min-width:0}
.song-title{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:.73rem;color:var(--text3)}
.song-actions{display:flex;gap:.25rem;flex-shrink:0}
.song-dur{font-size:.73rem;color:var(--text3);flex-shrink:0}
.playing-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.back-btn{background:none;border:none;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:.35rem;font-size:.82rem;padding:.4rem 0;margin-bottom:1rem;font-family:'DM Sans',sans-serif;min-height:36px}
.back-btn:active{color:var(--text)}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text3)}
.empty-icon{font-size:2.5rem;margin-bottom:.75rem}
 
/* ARTIST CHIPS */
.artist-chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.35rem}
.artist-chip{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:.2rem .6rem;font-size:.73rem;color:var(--accent);cursor:pointer}
 
/* ── ADMIN ── */
#screen-admin{height:100vh;height:100dvh}
.admin-header{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 1rem;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.admin-badge{background:rgba(248,113,113,.15);color:var(--danger);border:1px solid rgba(248,113,113,.2);border-radius:20px;padding:.18rem .55rem;font-size:.7rem}
.admin-body{display:flex;flex:1;min-height:0}
.admin-sidebar{width:190px;background:var(--bg2);border-right:1px solid var(--border);padding:.75rem;display:flex;flex-direction:column;gap:.2rem;flex-shrink:0;overflow-y:auto}
.admin-content{flex:1;padding:1.1rem 1.25rem;overflow-y:auto;min-width:0}
.admin-content::-webkit-scrollbar{width:4px}
.admin-content::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.admin-panel{display:none}.admin-panel.active{display:block}
table{width:100%;border-collapse:collapse}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);padding:.45rem .6rem;text-align:left;border-bottom:1px solid var(--border)}
td{padding:.55rem .6rem;font-size:.82rem;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
tr:active td{background:rgba(255,255,255,.02)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.form-group{display:flex;flex-direction:column;gap:.35rem}
.form-group.full{grid-column:1/-1}
.form-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;margin-bottom:1.1rem}
.form-card h3{margin-bottom:.8rem;font-size:.95rem}
.tag{display:inline-block;padding:.18rem .55rem;border-radius:20px;font-size:.7rem;font-weight:500}
.tag-active{background:rgba(74,222,128,.1);color:var(--success)}
.tag-used{background:rgba(251,191,36,.1);color:var(--warn)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem}
.stat-val{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:var(--accent)}
.stat-label{font-size:.7rem;color:var(--text3);margin-top:.1rem}
.code-box{font-family:monospace;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.28rem .6rem;font-size:.8rem;color:var(--accent);letter-spacing:.05em}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:1.1rem;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.upload-zone:active{border-color:var(--accent);background:rgba(124,58,237,.05)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:2}
.upload-zone-label{font-size:.83rem;color:var(--text3)}
.upload-zone-sub{font-size:.72rem;color:var(--text3);margin-top:.2rem}
.upload-preview{width:70px;height:70px;border-radius:7px;object-fit:cover;border:1px solid var(--border);display:block;margin:.45rem auto 0}
.upload-preview-audio{font-size:.75rem;color:var(--success);margin-top:.35rem}
 
/* Multi-artist picker */
.artist-picker{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.5rem;display:flex;flex-direction:column;gap:.3rem;max-height:160px;overflow-y:auto}
.artist-picker-item{display:flex;align-items:center;gap:.5rem;padding:.4rem;border-radius:5px;cursor:pointer;font-size:.85rem;color:var(--text2);min-height:40px}
.artist-picker-item:active{background:rgba(255,255,255,.05)}
.artist-picker-item.selected{background:rgba(124,58,237,.2);color:var(--accent)}
.artist-picker-item input[type=checkbox]{accent-color:var(--accent3);width:16px;height:16px;flex-shrink:0}
.selected-artists-preview{display:flex;flex-wrap:wrap;gap:.35rem;min-height:22px;margin-top:.35rem}
.sel-chip{background:rgba(124,58,237,.2);border:1px solid var(--border2);border-radius:20px;padding:.2rem .6rem;font-size:.73rem;color:var(--accent);display:flex;align-items:center;gap:.3rem}
.sel-chip-x{cursor:pointer;opacity:.7;font-size:.68rem;min-width:20px;min-height:20px;display:flex;align-items:center;justify-content:center}
 
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:flex-end;justify-content:center;z-index:999;padding:0}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:1.5rem;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding-bottom:calc(1.5rem + env(safe-area-inset-bottom))}
.modal h3{margin-bottom:1rem;font-size:1rem}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.modal-handle{width:40px;height:4px;background:var(--bg4);border-radius:2px;margin:0 auto 1.25rem}
 
/* PLAYLIST */
.pl-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
.pl-cover{width:100px;height:100px;border-radius:var(--radius);background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:2.5rem;flex-shrink:0;overflow:hidden}
.pl-cover img{width:100%;height:100%;object-fit:cover}
 
/* ── MOBILE RESPONSIVE ── */
@media(max-width:640px){
  .sidebar{display:none}
  .bottom-nav{display:flex}
  .player-right{display:none}
  .header-search{max-width:none}
  .user-badge{display:none}
  .signout-label{display:none}
  .grid-cards{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.6rem}
  .section-title{font-size:1.2rem}
  .admin-body{flex-direction:column}
  .admin-sidebar{width:100%;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:.5rem;height:auto;border-right:none;border-bottom:1px solid var(--border);gap:.25rem;min-height:52px}
  .admin-sidebar .sidebar-label{display:none}
  .admin-sidebar .nav-item{white-space:nowrap;flex-shrink:0;font-size:.78rem;padding:.4rem .65rem;min-height:36px}
  .admin-content{padding:.85rem 1rem}
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:1}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .player-bar{padding:0 .75rem;gap:.5rem}
  .player-info{max-width:130px}
  .admin-content table{font-size:.78rem}
  td,th{padding:.4rem .5rem}
  .modal{border-radius:20px 20px 0 0}
  .toast{bottom:calc(var(--bottom-nav-h) + var(--player-h) + .75rem)}
}
@media(min-width:641px){
  .bottom-nav{display:none!important}
  .song-actions{display:none}
  .song-row:hover .song-actions{display:flex}

<script>
// ============================================================
// APP STATE & FIREBASE SYNC 
// ============================================================
let DB = {
  admin: { username: 'admin', password: 'admin123' },
  users: [],
  accessCodes: [
    { code: 'WAVE2024', used: false, usedBy: null },
    { code: 'MUSIC001', used: false, usedBy: null }
  ],
  artists: [], albums: [], songs: [], playlists: [], recentlyPlayed: [],
};

let isSyncing = false;

async function saveDB() {
  if (isSyncing || !window.fb) return;
  isSyncing = true;
  try {
    await window.fb.setDoc(window.fb.doc(window.fb.db, "app_data", "main"), DB);
    console.log('Firebase save success');
  } catch(e) {
    console.error('Firebase save failed:', e);
    showToast('Save failed: ' + e.message, 'warn');
  } finally {
    isSyncing = false;
  }
}

function startLiveSync() {
  window.fb.onSnapshot(window.fb.doc(window.fb.db, "app_data", "main"), (docSnap) => {
    if (docSnap.exists()) {
      const remoteData = docSnap.data();
      Object.assign(DB, remoteData);
      refreshCurrentView();
    } else {
      saveDB();
    }
  });
}

function startup() {
  if (!window.fb) {
    setTimeout(startup, 100); 
    return;
  }
  startLiveSync();
  showToast('Connected to Firebase', 'ok');
}
 
// ============================================================
// GLOBAL STATE & AUTH
// ============================================================
let currentUser=null, currentUserType=null, currentUserId=null;
let currentSongId=null;
let currentQueue=[], currentQueueIdx=-1, originalQueue=[];
let isPlaying=false, isShuffle=false, isRepeat=false;
const audio=document.getElementById('audio-player');
 
function switchTab(tab){
  ['login','signup','guest'].forEach((t,i)=>{
    document.querySelectorAll('.auth-tab')[i].classList.toggle('active',t===tab);
    document.getElementById('tab-'+t).classList.toggle('active',t===tab);
  });
  clearMsg('auth-msg');
}
function showMsg(id,text,type='err'){
  const el=document.getElementById(id);
  if(el) el.innerHTML=`<div class="msg msg-${type==='ok'?'ok':type==='warn'?'warn':'err'}">${text}</div>`;
}
function clearMsg(id){const el=document.getElementById(id);if(el)el.innerHTML='';}
 
async function doSignup(){
  const u = document.getElementById('signup-user').value.trim();
  const p = document.getElementById('signup-pass').value;
  const p2 = document.getElementById('signup-pass2').value;
  const c = document.getElementById('signup-code').value.trim().toUpperCase();
  
  if(!u || !p || !p2 || !c) return showMsg('auth-msg', 'Please fill in all fields.');
  if(p !== p2) return showMsg('auth-msg', 'Passwords do not match.');
  if(DB.users.find(x=>x.username.toLowerCase()===u.toLowerCase())) return showMsg('auth-msg','Username already taken.');

  const code = DB.accessCodes.find(x => x.code === c && !x.used);
  if(!code) return showMsg('auth-msg', 'Invalid or used access code.');

  try {
    const fakeEmail = `${u.toLowerCase()}@jooser.app`;
    const userCred = await window.fb.signUp(window.fb.auth, fakeEmail, p);
    
    code.used = true; 
    code.usedBy = u;
    DB.users.push({ id: userCred.user.uid, username: u, codeUsed: true, type: 'user' });
    saveDB();

    currentUser = u; currentUserType = 'user'; currentUserId = userCred.user.uid;
    enterApp();
  } catch (error) {
    if (error.code === 'auth/email-already-in-use') showMsg('auth-msg', 'Username already taken.');
    else if (error.code === 'auth/weak-password') showMsg('auth-msg', 'Password must be at least 6 characters.');
    else showMsg('auth-msg', 'Error: ' + error.message);
  }
}

async function doLogin(){
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  
  if(!u || !p) return showMsg('auth-msg', 'Please fill in all fields.');
  try {
    const fakeEmail = `${u.toLowerCase()}@jooser.app`;
    const userCred = await window.fb.signIn(window.fb.auth, fakeEmail, p);
    currentUser = u; currentUserType = 'user'; currentUserId = userCred.user.uid;
    enterApp();
  } catch (error) {
    showMsg('auth-msg', 'Incorrect username or password.');
  }
}

function doGuest(){
  const c=document.getElementById('guest-code').value.trim().toUpperCase();
  if(!c) return showMsg('auth-msg','Please enter an access code.');
  const code=DB.accessCodes.find(x=>x.code===c&&!x.used);
  if(!code) return showMsg('auth-msg','Invalid or used access code.');
  currentUser='Guest'; currentUserType='guest'; currentUserId='guest';
  enterApp();
}

function enterApp(){
  document.getElementById('header-username').innerHTML=`<span class="user-badge">${currentUserType==='guest'?'👤 Guest':'🎧 '+currentUser}</span>`;
  showScreen('app');
  renderPlaylistNav();
  navTo('home',document.querySelector('[data-page="home"]'));
  clearMsg('auth-msg');
}

async function logout(){
  try {
    if (window.fb) await window.fb.signOut(window.fb.auth);
    currentUser=null; currentUserType=null; currentUserId=null;
    audio.pause(); audio.src=''; isPlaying=false; currentSongId=null; currentQueueIdx=-1;
    document.getElementById('search-input').value='';
    showScreen('auth');
  } catch (error) { console.error(error); }
}

function showAdminLogin(){document.getElementById('admin-login-overlay').classList.remove('hidden');}
function hideAdminLogin(){document.getElementById('admin-login-overlay').classList.add('hidden');clearMsg('admin-login-msg');}
function doAdminLogin(){
  const u=document.getElementById('admin-user-input').value.trim();
  const p=document.getElementById('admin-pass-input').value;
  if(u===DB.admin.username&&p===DB.admin.password){
    hideAdminLogin(); currentUserType='admin';
    showScreen('admin');
    adminNav('dashboard',document.querySelector('#screen-admin .nav-item'));
  } else showMsg('admin-login-msg','Invalid admin credentials.');
}
function adminLogout(){currentUserType=null;showScreen('auth');}
function showScreen(s){
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('screen-'+s);
  if(el) el.classList.add('active');
}
 
// ============================================================
// NAV & RENDERING
// ============================================================
function navTo(page,btn){
  document.querySelectorAll('#app-sidebar .nav-item').forEach(n=>n.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.querySelectorAll('.bottom-nav-item').forEach(b=>{
    b.classList.toggle('active', b.dataset.page===page);
  });
  const c=document.getElementById('main-content');
  if(page==='home') renderHome(c);
  else if(page==='artists') renderArtistsPage(c);
  else if(page==='albums') renderAlbumsPage(c);
  else if(page==='songs') renderAllSongs(c);
  else if(page==='recent') renderRecent(c);
  else if(page.startsWith('playlist:')) renderPlaylistPage(c,page.split(':')[1]);
}
 
function mobileNav(page, btn){
  document.querySelectorAll('.bottom-nav-item').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.querySelectorAll('#app-sidebar .nav-item').forEach(n => n.classList.remove('active'));
  const sideBtn = document.querySelector(`#app-sidebar [data-page="${page}"]`);
  if(sideBtn) sideBtn.classList.add('active');
  const c = document.getElementById('main-content');
  if(page === 'library') renderLibraryPage(c);
  else navTo(page, null);
}
 
function renderLibraryPage(c){
  const pls = getUserPlaylists();
  const recent = DB.recentlyPlayed.map(id=>getSong(id)).filter(Boolean).slice(0,5);
  c.innerHTML = `
    <div class="section-header"><h1 class="section-title">Library</h1></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem">
      <h2 style="font-size:1rem">Your Playlists</h2>
      <button class="btn btn-secondary btn-xs" onclick="showCreatePlaylist()">+ New</button>
    </div>
    ${pls.length===0 ? `<div style="color:var(--text3);font-size:.85rem;margin-bottom:1.5rem;padding:.75rem 0">No playlists yet.</div>` :
      `<div style="display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.5rem">
        ${pls.map(p=>`
          <div style="display:flex;align-items:center;gap:.75rem;padding:.6rem .5rem;border-radius:var(--radius-sm);cursor:pointer;background:var(--bg2);border:1px solid var(--border)" onclick="navTo('playlist:${p.id}',null)">
            <div style="width:46px;height:46px;border-radius:8px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.3rem">
              ${p.artUrl?`<img src="${p.artUrl}" style="width:100%;height:100%;object-fit:cover">`:'📋'}
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:.88rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
              <div style="font-size:.72rem;color:var(--text3)">${p.songs.length} songs</div>
            </div>
            <button class="btn-ghost btn-xs" onclick="event.stopPropagation();deletePlaylist('${p.id}')" style="color:var(--text3);font-size:.8rem;padding:.3rem .5rem">✕</button>
          </div>`).join('')}
      </div>`}
    ${recent.length>0 ? `
      <div class="section-header"><h2 style="font-size:1rem">Recently Played</h2></div>
      <div>${recent.map((s,i)=>songRowHtml(s,i,recent.map(x=>x.id))).join('')}</div>` : ''}
  `;
}
 
function refreshCurrentView(){
  if(!document.getElementById('screen-app').classList.contains('active')) return;
  const active=document.querySelector('#app-sidebar .nav-item.active');
  const page=active?active.dataset.page:'home';
  const c=document.getElementById('main-content');
  if(page==='home') renderHome(c);
  else if(page==='artists') renderArtistsPage(c);
  else if(page==='albums') renderAlbumsPage(c);
  else if(page==='songs') renderAllSongs(c);
  else if(page==='recent') renderRecent(c);
  renderPlaylistNav();
}
 
// ============================================================
// HELPERS
// ============================================================
function getArtist(id){return DB.artists.find(x=>x.id===id);}
function getAlbum(id){return DB.albums.find(x=>x.id===id);}
function getSong(id){return DB.songs.find(x=>x.id===id);}
function fmtTime(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}
function timeOfDay(){const h=new Date().getHours();return h<12?'morning':h<18?'afternoon':'evening';}
function fileToDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(file);});}
 
// === FIREBASE DIRECT UPLOAD HELPER ===
async function uploadFileToFirebase(file, folderName) {
  if (!file || !window.fb) return null;
  try {
    const uniqueName = Date.now() + '_' + file.name;
    const storageRef = window.fb.ref(window.fb.storage, `${folderName}/${uniqueName}`);
    await window.fb.uploadBytes(storageRef, file);
    return await window.fb.getDownloadURL(storageRef);
  } catch (error) {
    console.error("Upload failed:", error);
    throw error;
  }
}

function songArtistNames(song){
  const ids=song.artistIds||[song.artistId];
  return ids.map(id=>{const a=getArtist(id);return a?a.name:'Unknown';}).join(', ');
}
 
function songRowHtml(song,idx,queueList){
  const al=getAlbum(song.albumId);
  const playing=currentSongId===song.id&&isPlaying;

// ============================================================
function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function playFromQueue(queueIds,idx){
  if(typeof queueIds==='string') queueIds=JSON.parse(queueIds);
  originalQueue=[...queueIds];
  if(isShuffle){
    currentQueue=shuffleArray(queueIds);
    const songId=queueIds[idx];
    const si=currentQueue.indexOf(songId);
    if(si>0){[currentQueue[0],currentQueue[si]]=[currentQueue[si],currentQueue[0]];}
    currentQueueIdx=0;
  } else {
    currentQueue=[...queueIds];
    currentQueueIdx=idx;
  }
  loadSong(currentQueue[currentQueueIdx]);
}
function shuffleAndPlay(queueIds){
  if(typeof queueIds==='string') queueIds=JSON.parse(queueIds);
  isShuffle=true; updateShuffleBtn();
  playFromQueue(queueIds,0);
}
function loadSong(id){
  const s=getSong(id); if(!s) return;
  currentSongId=id;
  if(!DB.recentlyPlayed.includes(id)) DB.recentlyPlayed.unshift(id);
  if(DB.recentlyPlayed.length>50) DB.recentlyPlayed.pop();
  saveDB();
  if(s.audioUrl){
    audio.src=s.audioUrl;
    audio.play().then(()=>{isPlaying=true;updatePlayBtn();}).catch(()=>{isPlaying=false;updatePlayBtn();});
  } else {
    audio.src=''; isPlaying=false; updatePlayBtn();
  }
  const al=getAlbum(s.albumId);
  document.getElementById('player-title').textContent=s.title;
  document.getElementById('player-artist').textContent=songArtistNames(s);
  const artImg=s.artUrl||(al?al.artUrl:null);
  document.getElementById('player-cover').innerHTML=artImg?`<img src="${artImg}">`:s.emoji||'♪';
}
function togglePlay(){
  if(!currentSongId){if(DB.songs.length) playFromQueue(DB.songs.map(s=>s.id),0); return;}
  if(isPlaying){audio.pause();}else{audio.play().catch(()=>{});}
}
function prevSong(){if(currentQueueIdx>0){currentQueueIdx--;loadSong(currentQueue[currentQueueIdx]);}}
function nextSong(){
  if(currentQueueIdx<currentQueue.length-1){currentQueueIdx++;loadSong(currentQueue[currentQueueIdx]);}
  else if(isRepeat){currentQueueIdx=0;loadSong(currentQueue[0]);}
  else{isPlaying=false;updatePlayBtn();}
}
function toggleShuffle(){
  isShuffle=!isShuffle;
  if(isShuffle&&currentQueue.length>0){
    const curId=currentQueue[currentQueueIdx];
    currentQueue=shuffleArray(originalQueue);
    const si=currentQueue.indexOf(curId);
    if(si>0){[currentQueue[0],currentQueue[si]]=[currentQueue[si],currentQueue[0]];}
    currentQueueIdx=0;
  } else if(!isShuffle&&originalQueue.length>0){
    const curId=currentSongId;
    currentQueue=[...originalQueue];
    currentQueueIdx=currentQueue.indexOf(curId);
  }
  updateShuffleBtn();
}
function toggleRepeat(){isRepeat=!isRepeat;updateRepeatBtn();}
function updatePlayBtn(){document.getElementById('play-btn').textContent=isPlaying?'⏸':'▶';}
function updateShuffleBtn(){document.getElementById('shuffle-btn').classList.toggle('active-ctrl',isShuffle);}
function updateRepeatBtn(){document.getElementById('repeat-btn').classList.toggle('active-ctrl',isRepeat);}
function seekTrack(e){if(!audio.duration)return;audio.currentTime=(e.offsetX/document.getElementById('progress-bar').offsetWidth)*audio.duration;}
audio.addEventListener('timeupdate',()=>{
  if(!audio.duration)return;
  document.getElementById('progress-fill').style.width=((audio.currentTime/audio.duration)*100)+'%';
  document.getElementById('time-cur').textContent=fmtTime(audio.currentTime);
  document.getElementById('time-dur').textContent=fmtTime(audio.duration);
});
audio.addEventListener('ended',()=>nextSong());
audio.addEventListener('play',()=>{isPlaying=true;updatePlayBtn();});
audio.addEventListener('pause',()=>{isPlaying=false;updatePlayBtn();});

let pickerSelectedIds=[];
function buildArtistPicker(containerId,selectedIds){
  pickerSelectedIds=[...selectedIds];
  const el=document.getElementById(containerId);
  el.innerHTML=`
    <div class="artist-picker" id="picker-list-${containerId}">
      ${DB.artists.length===0?`<div style="color:var(--text3);font-size:.8rem;padding:.3rem">No artists added yet.</div>`:''}
      ${DB.artists.map(a=>`
        <label class="artist-picker-item ${pickerSelectedIds.includes(a.id)?'selected':''}" id="pitem-${containerId}-${a.id}">
          <input type="checkbox" value="${a.id}" ${pickerSelectedIds.includes(a.id)?'checked':''} onchange="pickerToggle('${containerId}','${a.id}',this.checked)">
          ${a.artUrl?`<img src="${a.artUrl}" style="width:22px;height:22px;border-radius:50%;object-fit:cover">`:'🎤'}
          <span>${a.name}</span>
        </label>`).join('')}
    </div>
    <div class="selected-artists-preview" id="picker-preview-${containerId}"></div>`;
  updatePickerPreview(containerId);
}
function pickerToggle(containerId,artistId,checked){
  if(checked){
    if(!pickerSelectedIds.includes(artistId)) pickerSelectedIds.push(artistId);
  } else {
    pickerSelectedIds=pickerSelectedIds.filter(x=>x!==artistId);
  }
  const item=document.getElementById(`pitem-${containerId}-${artistId}`);
  if(item) item.classList.toggle('selected',checked);
  updatePickerPreview(containerId);
}
function updatePickerPreview(containerId){
  const el=document.getElementById(`picker-preview-${containerId}`);
  if(!el) return;
  el.innerHTML=pickerSelectedIds.map(id=>{
    const a=getArtist(id); if(!a) return '';
    return`<span class="sel-chip">${a.name}<span class="sel-chip-x" onclick="pickerRemove('${containerId}','${id}')">✕</span></span>`;
  }).join('');
}
function pickerRemove(containerId,artistId){
  pickerSelectedIds=pickerSelectedIds.filter(x=>x!==artistId);
  const cb=document.querySelector(`#picker-list-${containerId} input[value="${artistId}"]`);
  if(cb){cb.checked=false;cb.closest('.artist-picker-item').classList.remove('selected');}
  updatePickerPreview(containerId);
}

  if(!pass||!newUser) return showMsg('settings-user-msg','Please fill in all fields.');
  if(pass!==DB.admin.password) return showMsg('settings-user-msg','Incorrect password.');
  DB.admin.username=newUser;
  document.getElementById('set-user-pass').value='';
  document.getElementById('set-user-new').value='';
  saveDB();
  showMsg('settings-user-msg','Username updated to "'+newUser+'"!','ok');
}
function hardResetAdmin(){
  const word=document.getElementById('reset-confirm-word').value.trim().toUpperCase();
  if(word!=='RESET') return showMsg('settings-reset-msg','Type RESET in the box to confirm.','warn');
  DB.admin.username='admin';
  DB.admin.password='admin123';
  document.getElementById('reset-confirm-word').value='';
  saveDB();
  showMsg('settings-reset-msg','Admin reset to admin / admin123.','ok');
}

document.addEventListener('DOMContentLoaded', () => startup());
